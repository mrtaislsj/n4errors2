<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>日本語文法 幽玄の庵 〜百問全方位攻堅絵巻〜</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@500;700;900&family=Yuji+Boku&display=swap');

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 50% 25%, #08111d 0%, #03060a 100%);
      font-family: 'Zen Old Mincho', 'Yu Mincho', 'Hiragino Mincho ProN', serif;
      color: #e2e8f0;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Ambient Glowing Gold Particles & Fireflies */
    #ambient-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    /* ========================================================
       PC & iPad UI: Fixed 16:9 Landscape Frame (黒漆・螺鈿・金泥)
       ======================================================== */
    .zen-viewport {
      width: min(96vw, 170.66vh);
      height: min(54vw, 96vh);
      aspect-ratio: 16 / 9;
      background: #090e17;
      background-image: 
        radial-gradient(ellipse at 85% 15%, rgba(20, 48, 85, 0.45) 0%, transparent 60%),
        linear-gradient(to bottom, #070c14 0%, #0f1827 100%);
      border: 8px solid #16202e;
      border-radius: 8px;
      box-shadow: 
        0 0 0 2px #d4af37,
        0 0 0 6px #05080d,
        0 24px 60px rgba(0, 0, 0, 0.95);
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      z-index: 20;
    }

    /* Gilded Moonlit Header */
    .zen-header {
      background: linear-gradient(180deg, #101928 0%, #09101a 100%);
      border-bottom: 2px solid #ca8a04;
      padding: 8px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 14px rgba(0,0,0,0.6);
      position: relative;
      z-index: 25;
      flex-shrink: 0;
    }

    .zen-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.12rem;
      font-weight: 800;
      letter-spacing: 3px;
      color: #fde047;
      text-shadow: 0 0 12px rgba(250, 204, 21, 0.4);
    }

    .zen-logo svg {
      width: 24px;
      height: 24px;
      fill: #facc15;
    }

    .header-ctrls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .raden-badge {
      background: #071018;
      border: 1px solid #0d9488;
      box-shadow: inset 0 0 8px rgba(45, 212, 191, 0.25);
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 0.82rem;
      color: #5eead4;
      font-weight: 700;
      white-space: nowrap;
    }

    .btn-catalog {
      background: linear-gradient(180deg, #a16207 0%, #713f12 100%);
      color: #fef08a;
      border: 1px solid #facc15;
      border-radius: 4px;
      padding: 5px 14px;
      font-family: inherit;
      font-weight: 800;
      cursor: pointer;
      font-size: 0.82rem;
      box-shadow: 0 2px 0 #3a1d06;
      transition: all 0.1s ease;
      white-space: nowrap;
    }

    .btn-catalog:hover { background: #ca8a04; }
    .btn-catalog:active { transform: translateY(2px); box-shadow: none; }

    /* Stage Canvas Content */
    .stage-content {
      flex: 1;
      padding: 10px 22px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-y: auto;
    }

    .part-banner {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      align-self: flex-start;
      background: linear-gradient(90deg, #064e3b 0%, #0f766e 100%);
      color: #ccfbf1;
      border-left: 4px solid #2dd4bf;
      padding: 3px 12px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 1px;
      border-radius: 2px;
      margin-bottom: 6px;
      flex-shrink: 0;
    }

    /* Complex Scenic Artwork Viewport */
    .zen-illustration-box {
      width: 100%;
      height: 138px;
      background: #04070c;
      border: 2px solid #ca8a04;
      border-radius: 6px;
      box-shadow: inset 0 0 16px rgba(0,0,0,0.85), 0 4px 12px rgba(0,0,0,0.4);
      margin-bottom: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      flex-shrink: 0;
    }

    .zen-illustration-box svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Question Slate */
    .question-slate {
      background: #0d1522;
      border: 2px solid #29384d;
      border-radius: 6px;
      padding: 10px 16px;
      font-size: 1.18rem;
      font-weight: 800;
      color: #f8fafc;
      line-height: 1.45;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
      margin-bottom: 8px;
      flex-shrink: 0;
    }

    .question-num {
      color: #38bdf8;
      font-size: 1.3rem;
      margin-right: 8px;
      font-family: 'Yuji Boku', serif;
    }

    /* 4-Option Grid (2x2 Layout) */
    .choices-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 8px;
      flex-shrink: 0;
    }

    .choice-tile {
      background: #111a28;
      border: 2px solid #1e324a;
      border-radius: 6px;
      padding: 11px 14px;
      font-family: inherit;
      font-size: 1.02rem;
      font-weight: 700;
      color: #e2e8f0;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
      box-shadow: 0 3px 0 #080d14, 0 3px 6px rgba(0,0,0,0.3);
      transition: all 0.15s ease;
    }

    .choice-tile:hover:not([disabled]) {
      background: #19263a;
      border-color: #38bdf8;
      transform: translateY(-2px);
    }

    .choice-tile:active:not([disabled]) {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #080d14;
    }

    .tile-index {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #1a2536;
      border: 1px solid #475569;
      color: #fde047;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.78rem;
      font-weight: 800;
      flex-shrink: 0;
    }

    .choice-tile.wrong {
      background: #450a0a !important;
      border-color: #ef4444 !important;
      color: #fca5a5 !important;
      animation: zenShake 0.35s ease;
      opacity: 0.85;
    }

    @keyframes zenShake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    .choice-tile.correct {
      background: #064e3b !important;
      border-color: #10b981 !important;
      color: #a7f3d0 !important;
      box-shadow: 0 0 16px rgba(16, 185, 129, 0.45) !important;
    }

    .choice-tile.correct .tile-index {
      background: #047857 !important;
      color: #ffffff !important;
      border-color: #34d399 !important;
    }

    /* Explanation Scroll */
    .scroll-explanation {
      display: none;
      background: #0c1420;
      border: 2px solid #ca8a04;
      border-radius: 6px;
      padding: 10px 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
      animation: unrollScroll 0.35s ease-out;
      margin-top: 2px;
      margin-bottom: 8px;
    }

    @keyframes unrollScroll {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .scroll-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: #fde047;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
      border-bottom: 1px dashed #ca8a04;
      padding-bottom: 2px;
    }

    .scroll-body {
      font-size: 0.88rem;
      line-height: 1.5;
      color: #cbd5e1;
    }

    /* Footer Navigation */
    .zen-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 2px;
      flex-shrink: 0;
    }

    .hint-alert {
      font-size: 0.85rem;
      font-weight: 700;
      color: #f87171;
      min-height: 20px;
    }

    .btn-next {
      background: linear-gradient(180deg, #15803d 0%, #166534 100%);
      color: #ffffff;
      border: 2px solid #ca8a04;
      border-radius: 6px;
      padding: 8px 22px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 0 #052e16, 0 6px 15px rgba(0,0,0,0.3);
      display: none;
      transition: all 0.1s ease;
      white-space: nowrap;
    }

    .btn-next:hover { background: #16a34a; }
    .btn-next:active { transform: translateY(2px); box-shadow: 0 2px 0 #052e16; }

    /* Catalog Drawer */
    .catalog-modal {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(3, 6, 10, 0.92);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 100;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .catalog-board {
      background: #0a111a;
      width: 100%;
      max-width: 780px;
      max-height: 85%;
      border: 2px solid #ca8a04;
      box-shadow: 0 0 25px rgba(202, 138, 4, 0.25);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
    }

    .catalog-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #ca8a04;
      padding-bottom: 8px;
      margin-bottom: 10px;
    }

    .catalog-title {
      font-size: 1.2rem;
      font-weight: 800;
      color: #fde047;
    }

    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 6px;
      overflow-y: auto;
      padding: 4px;
      flex: 1;
    }

    .q-pill {
      background: #111a28;
      border: 1px solid #1e324a;
      border-radius: 4px;
      padding: 6px 0;
      text-align: center;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      color: #94a3b8;
      transition: all 0.1s ease;
    }

    .q-pill:hover { background: #19263a; color: #fde047; }
    .q-pill.cleared { background: #064e3b; border-color: #10b981; color: #6ee7b7; }
    .q-pill.active { background: #854d0e; color: #fef08a; border-color: #facc15; }

    .btn-close-catalog {
      background: #334155;
      color: #ffffff;
      border: 1px solid #64748b;
      padding: 5px 14px;
      font-family: inherit;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 700;
    }

    /* Start / Finish Screens */
    .splash-screen {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #070c14;
      background-image: radial-gradient(circle at center, #0f1827 0%, #05080d 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
      z-index: 50;
    }

    .splash-title {
      font-family: 'Yuji Boku', serif;
      font-size: 2.8rem;
      color: #fde047;
      margin: 8px 0;
      letter-spacing: 4px;
      text-shadow: 0 0 18px rgba(250, 204, 21, 0.4);
    }

    .splash-subtitle {
      font-size: 1.15rem;
      color: #5eead4;
      margin-bottom: 24px;
      font-weight: 700;
    }

    .btn-start {
      background: linear-gradient(180deg, #15803d 0%, #166534 100%);
      color: #ffffff;
      border: 2px solid #facc15;
      border-radius: 8px;
      padding: 14px 40px;
      font-family: inherit;
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 2px;
      cursor: pointer;
      box-shadow: 0 5px 0 #052e16, 0 10px 25px rgba(0,0,0,0.5);
      transition: all 0.15s ease;
    }

    .btn-start:active { transform: translateY(3px); box-shadow: 0 2px 0 #052e16; }

    /* ========================================================
       RESPONSIVE ADAPTATION:
       Mobile Phones: Adapts to Vertical 9:16 layout
       ======================================================== */
    @media screen and (max-width: 650px), screen and (orientation: portrait) and (max-device-width: 800px) {
      .zen-viewport {
        width: min(96vw, calc(96vh * 9 / 16));
        height: min(calc(96vw * 16 / 9), 96vh);
        aspect-ratio: 9 / 16;
        max-width: 480px;
        border-width: 6px;
        box-shadow: 
          0 0 0 2px #d4af37,
          0 0 0 5px #05080d,
          0 12px 30px rgba(0, 0, 0, 0.95);
      }

      .zen-header { padding: 6px 10px; }
      .zen-logo { font-size: 0.92rem; gap: 6px; }
      .zen-logo svg { width: 20px; height: 20px; }
      .raden-badge { font-size: 0.72rem; padding: 3px 6px; }
      .btn-catalog { font-size: 0.72rem; padding: 3px 8px; }
      .stage-content { padding: 8px 12px; }
      .part-banner { font-size: 0.72rem; padding: 2px 8px; margin-bottom: 5px; }
      .zen-illustration-box { height: 85px; margin-bottom: 6px; }
      .question-slate { font-size: 1.02rem; padding: 8px 12px; margin-bottom: 6px; line-height: 1.4; }
      .question-num { font-size: 1.15rem; }
      .choices-grid { grid-template-columns: 1fr; gap: 6px; margin-bottom: 6px; }
      .choice-tile { font-size: 0.92rem; padding: 8px 12px; }
      .tile-index { width: 22px; height: 22px; font-size: 0.75rem; }
      .scroll-explanation { padding: 8px 12px; margin-bottom: 6px; }
      .scroll-title { font-size: 0.88rem; }
      .scroll-body { font-size: 0.82rem; line-height: 1.45; }
      .btn-next { font-size: 0.88rem; padding: 7px 16px; }
      .hint-alert { font-size: 0.78rem; }
      .catalog-grid { grid-template-columns: repeat(5, 1fr); gap: 5px; }
      .catalog-title { font-size: 1.05rem; }
      .splash-title { font-size: 2.1rem; }
      .splash-subtitle { font-size: 0.95rem; margin-bottom: 20px; }
      .btn-start { font-size: 1.1rem; padding: 12px 30px; }
    }
  </style>
</head>
<body>

  <!-- Ambient Glowing Fireflies Canvas -->
  <canvas id="ambient-canvas"></canvas>

  <div class="zen-viewport">
    
    <!-- Top Indigo Header -->
    <header class="zen-header">
      <div class="zen-logo">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9" fill="none" stroke="#facc15" stroke-width="2"/>
          <path d="M12 3 A9 9 0 0 0 21 12 A9 9 0 1 1 12 3 Z" fill="#facc15"/>
        </svg>
        <span>幽玄の庵 〜百問全方位攻堅絵巻〜</span>
      </div>
      <div class="header-ctrls">
        <span class="raden-badge" id="hud-progress">第 1 / 100 題</span>
        <span class="raden-badge" id="hud-score" style="color: #facc15;">初手正解: 0</span>
        <button class="btn-catalog" onclick="openCatalog()">目録 ☰</button>
      </div>
    </header>

    <!-- Question Stage Content -->
    <main class="stage-content" id="game-stage">
      <div class="part-banner" id="part-tag">第 1 部：格助詞與副助詞專項</div>
      
      <!-- Thematic High-Detail SVG Art Box -->
      <div class="zen-illustration-box" id="illustration-container"></div>

      <!-- Question Slate -->
      <div class="question-slate" id="question-box">
        <span class="question-num" id="q-num">問1.</span>
        <span id="q-text">問題読み込み中...</span>
      </div>

      <div class="choices-grid" id="choices-container"></div>

      <div class="scroll-explanation" id="explanation-scroll">
        <div class="scroll-title">📜 幽玄文法指南・詳細解説</div>
        <div class="scroll-body" id="explanation-text"></div>
      </div>

      <footer class="zen-footer">
        <div class="hint-alert" id="hint-msg"></div>
        <button class="btn-next" id="next-btn" onclick="nextQuestion()">次の修練へ進む ➜</button>
      </footer>
    </main>

    <!-- Clean Start Splash Screen -->
    <div class="splash-screen" id="start-screen">
      <svg width="76" height="76" viewBox="0 0 24 24" fill="none" stroke="#facc15" stroke-width="1.5" style="margin-bottom: 12px;">
        <circle cx="12" cy="12" r="10"/>
        <path d="M12 2a10 10 0 0 0 7.07 17.07A10 10 0 1 1 12 2z" fill="#facc15"/>
      </svg>
      <h1 class="splash-title">日本語文法 幽玄の庵</h1>
      <p class="splash-subtitle">『大家的日本語』第 26〜50 課 全 100 題 攻堅絵巻</p>
      <button class="btn-start" onclick="startGame()">入庵・修練開始</button>
    </div>

    <!-- Finish Screen -->
    <div class="splash-screen" id="finish-screen" style="display:none;">
      <div style="font-size: 3.5rem; margin-bottom: 6px;">✨ 満願成就 ✨</div>
      <h1 class="splash-title" style="color: #38bdf8;">百問完遂・全方位制覇！</h1>
      <p class="splash-subtitle" id="finish-summary"></p>
      <button class="btn-start" onclick="restartGame()">再び修練に挑む 🔄</button>
    </div>

    <!-- Catalog Drawer Modal -->
    <div class="catalog-modal" id="catalog-modal">
      <div class="catalog-board">
        <div class="catalog-head">
          <div class="catalog-title">📜 幽玄修練目録（全百問）</div>
          <button class="btn-close-catalog" onclick="closeCatalog()">閉じる ✕</button>
        </div>
        <div class="catalog-grid" id="catalog-pills"></div>
      </div>
    </div>

  </div>

  <script>
    /* Traditional Web Audio Synthesizer */
    let audioCtx = null;

    function initAudio() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      } catch(e) {}
    }

    function playBambooClack() {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(320, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.12);
      } catch(e) {}
    }

    function playHyoshigi() {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1600, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(700, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
      } catch(e) {}
    }

    function playRinBell() {
      if (!audioCtx) return;
      try {
        const freqs = [587.33, 880.00, 1174.66];
        freqs.forEach((f, i) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(f, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.18 / (i + 1), audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.2);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 1.2);
        });
      } catch(e) {}
    }

    /* 
       Question-Specific Vector Visual Engine:
       Constructs context-specific vectors directly corresponding to every question's meaning
    */
    function renderQuestionArtwork(qId, caption) {
      const defs = `
        <defs>
          <linearGradient id="gDawn" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#020617"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#3b0764"/></linearGradient>
          <linearGradient id="gZenBlue" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#090e17"/><stop offset="60%" stop-color="#0f1d30"/><stop offset="100%" stop-color="#1a2e4c"/></linearGradient>
          <linearGradient id="gGold" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#ca8a04"/><stop offset="50%" stop-color="#fef08a"/><stop offset="100%" stop-color="#ca8a04"/></linearGradient>
          <pattern id="patRipples" width="24" height="12" patternUnits="userSpaceOnUse"><path d="M 0,12 Q 12,0 24,12" fill="none" stroke="#38bdf8" stroke-width="0.8" opacity="0.25"/></pattern>
        </defs>
      `;

      function getVisualElements(id) {
        switch(id) {
          case 1:
            return `<rect width="480" height="136" fill="url(#gZenBlue)"/>

      {
        partName: "第 1 部：格助詞與副助詞專項",
        questions: [
          { id: 1, q: "今日の 朝ごはん（ ）パンと 卵を 食べました。", options: ["を", "に", "で", "が"], ans: 2, exp: "文末に「パンと卵を」とあり、直接目的語（ヲ格）が既に提示されています。ここでの「に」は「〜として、〜の位置づけで」という役割・名目を表します（朝ごはんにパンと卵を食べた）。1の「を」を入れると二重ヲ格の禁止に抵触します。" },
          { id: 2, q: "日本旅行の お土産（ ）きれいな 人形を 買いました。", options: ["で", "を", "に", "と"], ans: 3, exp: "問1と同様、名目・目的を表す格助詞「に」を用います（お土産に人形を買った＝手土産として購入した）。" },
          { id: 3, q: "夫は お酒（ ）全然 飲めません。", options: ["を", "が", "に", "で"], ans: 2, exp: "可能動詞「飲める（飲めない）」が表す能力・可能の対象は、原則として助詞「が」で示します（お酒が飲めない）。動作そのものを表す他動詞の場合のみ「お酒を飲む」となります。" },
          { id: 4, q: "この ハサミは、硬い 針金を 切る（ ）使います。", options: ["のを", "のに", "のは", "のが"], ans: 2, exp: "道具や行為の用途・目的を表す定型構文は「動詞辞書形＋のに＋使う / 役に立つ / 便利だ / 時間がかかる」です。したがって「切るのに使います」が正解です。" },
          { id: 5, q: "後ろの 人にも 聞こえる（ ）、大きな 声で 話してください。", options: ["ために", "ように", "のに", "ようにして"], ans: 2, exp: "「聞こえる」は無意志動詞（自然に耳に入る可能状態）です。無意志動詞・可能動詞・否定形を受けて「ある状態が実現するように」と目的を表す場合は「〜ように」を用います。" },
          { id: 6, q: "自分の 店を 持つ（ ）、一生懸命 お金を 貯めて います。", options: ["ために", "ように", "のに", "ことに"], ans: 1, exp: "「店を持つ」は話者の明確な人為的意志動詞であり、前後件の主語も同一（私）です。明確な目的・目標に向かって行動する場合は「動詞辞書形＋ために」を用います。" },
          { id: 7, q: "私は 1年（ ）2回、国へ 帰ります。", options: ["が", "を", "に", "で"], ans: 3, exp: "頻度や割合の基準を表す構文は「［期間］に［回数］」です（1年に2回）。数量詞「2回」の後ろではなく、「1年」の直後に格助詞「に」を置きます。" },
          { id: 8, q: "家の 前で、変な 音（ ）しましたよ。", options: ["を", "が", "に", "で"], ans: 2, exp: "五感（聴覚・嗅覚・味覚など）で知覚される客観的現象を表す慣用表現は「音 / 声 / におい / 味が する」であり、主格助詞「が」を固定で用います。" },
          { id: 9, q: "レポートは 今週の 金曜日（ ）出さなければ なりません。", options: ["まで", "までに", "のに", "から"], ans: 2, exp: "後件が「出さなければならない（提出する）」という一回性の完了動作であるため、動作を完了すべき最終期限（デッドライン）を表す「までに」が正解です。" },
          { id: 10, q: "道が ひどく 混んで いて、会社まで 2時間（ ）かかって しまった。", options: ["で", "に", "も", "を"], ans: 3, exp: "動詞「かかる」は所要時間を表す際に直接数量詞をとります。ここでは渋滞により「2時間もかかってしまった」と、所要時間が予想外に長かったことに対する驚きや不満を強調するため、副助詞「も」を用います。" },
          { id: 11, q: "時間が あったら、喫茶店で お茶（ ）飲みませんか。", options: ["なら", "でも", "ため", "ほど"], ans: 2, exp: "相手に対して極端ではない一例を挙げ、「〜などはいかがですか」と柔らかく提案・勧誘する副助詞は「でも」です（お茶でも飲みませんか）。" },
          { id: 12, q: "すみません、この 漢字は ひらがなで 何（ ）読みますか。", options: ["を", "で", "と", "に"], ans: 3, exp: "読み方、発言、引用の内容を示す助詞は「と」です（何と読みますか）。" },
          { id: 13, q: "妹は 日本の 歴史や 文化（ ）とても 興味が あります。", options: ["を", "に", "で", "が"], ans: 2, exp: "関心や興味が向かう対象は格助詞「に」で提示します（〜に興味がある）。" },
          { id: 14, q: "この 歌手は 若い 女性（ ）とても 人気があります。", options: ["を", "に", "で", "と"], ans: 2, exp: "支持や人気の受け手・対象を表す場合は格助詞「に」を用います（若い女性に人気がある）。" },
          { id: 15, q: "チキンラーメンは 安藤百福さん（ ）よって 発明されました。", options: ["に", "で", "から", "を"], ans: 1, exp: "建造・発明・発見などの受身文において、その行為者・創造者を示す表現は「〜によって」です。" },
          { id: 16, q: "日本酒は 米（ ）造られます。", options: ["で", "から", "に", "を"], ans: 2, exp: "原料の形状や性質が化学的に変化し、完成品から元の素材が一目で分からない場合は「から」を用います（米から日本酒を造る）。" },
          { id: 17, q: "昔の 日本の 家は 木（ ）造られました。", options: ["から", "で", "に", "を"], ans: 2, exp: "完成品を見ても元の素材がそのまま視覚的に判別できる材料（物理的加工）には「で」を用います（木で家を造る）。" },
          { id: 18, q: "飛行機は 新幹線（ ）速いです。", options: ["より", "ほど", "くらい", "から"], ans: 1, exp: "比較の基準を示す表現は「〜より」です（新幹線より速い＝新幹線と比べて速い）。" },
          { id: 19, q: "昨日は 日曜日でしたが、どこ（ ）出かけませんでした。", options: ["には", "でも", "へも", "をも"], ans: 3, exp: "疑問詞＋助詞＋「も」＋否定表現で全面否定を表します。移動の目的地を全面的に否定する場合は「どこへも（または どこにも）行きませんでした」となります。" },
          { id: 20, q: "次の 会議は 来週の 月曜日（ ）しましょう。", options: ["で", "に", "を", "と"], ans: 2, exp: "選択肢の中から最終的に物事を決定・指定する文型は「名詞＋にする」です（月曜日にしましょう）。" },
          { id: 21, q: "教室（ ）田中さんが いますよ。", options: ["で", "に", "を", "へ"], ans: 2, exp: "人や物が静止して存在する場所を表す存在動詞（いる／ある）の前には格助詞「に」を用います（教室に田中さんがいる）。" },
          { id: 22, q: "教室（ ）みんなで 日本語の 試験を 受けました。", options: ["に", "で", "を", "へ"], ans: 2, exp: "積極的な動作・行為（試験を受ける）が行われる活動場所には格助詞「で」を用います（教室で試験を受けた）。" },
          { id: 23, q: "ゲームの ことで、弟（ ）けんかして しまいました。", options: ["を", "に", "と", "で"], ans: 3, exp: "喧嘩、相談、握手など、相互に働きかけ合う相手を示す助詞は「と」です（弟とけんかした）。" },
          { id: 24, q: "会社へ 行く（ ）で、ポストに 手紙を 出しました。", options: ["あいだ", "とちゅう", "まんなか", "なか"], ans: 2, exp: "移動プロセスの途中で特定の動作を行う場合は、場所・状況を表す助詞「で」を用いて「途中で」とします。「途中に」は「途中にコンビニがある」のように、静態的な存在・位置関係を示す場合に限られます。" },
          { id: 25, q: "この 本を 買うなら、5,000円（ ）必要です。", options: ["は", "も", "で", "に"], ans: 1, exp: "数量詞に助詞「は」を接続させると、「最低でもそれだけは必要である」という最低限度の見積もりを表します（5,000円は必要です）。" }

          { id: 100, q: "朝、家を（ ）、一面 雪景色だった。", options: ["出れば", "出ると", "出てから", "出たら"], ans: 2, exp: "「家を出た瞬間に、目の前に雪景色が広がっているのを発見した」という契機・発見を表す条件表現は「動詞辞書形＋と」です（家を出ると、雪景色だった）。" }

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    let activeQuestions = [];
    let currentIndex = 0;
    let firstTryCorrectCount = 0;
    let hasAttemptedWrong = false;
    let clearedQuestions = new Set();

    function assembleQuizQueue() {
      activeQuestions = [];
      rawParts.forEach(part => {
        const shuffledPartQuestions = shuffle(part.questions).map(item => {
          const meta = questionVisualMeta[item.id] || { theme: "bamboo_moon", caption: "【 幽 玄 の 景 】" };
          const shuffledOptions = shuffle(item.options.map((opt, idx) => ({
            text: opt,
            isCorrect: (idx + 1 === item.ans)
          })));
          return {
            ...item,
            partName: part.partName,
            graphicSVG: renderQuestionArtwork(item.id, meta.caption),
            shuffledOptions: shuffledOptions
          };
        });
        activeQuestions.push(...shuffledPartQuestions);
      });
    }

    function startGame() {
      initAudio();
      assembleQuizQueue();
      document.getElementById("start-screen").style.display = "none";
      renderQuestion();
    }
    window.startGame = startGame;

    function renderQuestion() {
      hasAttemptedWrong = false;
      const q = activeQuestions[currentIndex];

      document.getElementById("hud-progress").textContent = `第 ${currentIndex + 1} / 100 題`;
      document.getElementById("hud-score").textContent = `初手正解: ${firstTryCorrectCount}`;
      document.getElementById("part-tag").textContent = q.partName;
      document.getElementById("illustration-container").innerHTML = q.graphicSVG;
      document.getElementById("q-num").textContent = `問${q.id}.`;
      document.getElementById("q-text").textContent = q.q.replace(/問\s*\d+\s*/, "");
      
      document.getElementById("hint-msg").textContent = "";
      document.getElementById("explanation-scroll").style.display = "none";
      document.getElementById("next-btn").style.display = "none";

      const container = document.getElementById("choices-container");
      container.innerHTML = "";

      q.shuffledOptions.forEach((optObj, idx) => {
        const optionNum = idx + 1;
        const btn = document.createElement("button");
        btn.className = "choice-tile";
        btn.innerHTML = `<span class="tile-index">${optionNum}</span><span>${optObj.text}</span>`;
        btn.onclick = () => checkChoice(optObj, btn);
        container.appendChild(btn);
      });
    }

    function checkChoice(optObj, btnElement) {
      const q = activeQuestions[currentIndex];

      if (optObj.isCorrect) {
        btnElement.classList.add("correct");
        document.querySelectorAll(".choice-tile").forEach(b => b.disabled = true);
        
        playRinBell();
        clearedQuestions.add(currentIndex);

        if (!hasAttemptedWrong) {
          firstTryCorrectCount++;
          document.getElementById("hud-score").textContent = `初手正解: ${firstTryCorrectCount}`;
        }

        document.getElementById("explanation-text").innerHTML = `<strong>【正解：${q.options[q.ans - 1]}】</strong><br>${q.exp}`;
        document.getElementById("explanation-scroll").style.display = "block";
        document.getElementById("hint-msg").innerHTML = "<span style='color:#34d399;'>✨ 見事、正解です！</span>";
        document.getElementById("next-btn").style.display = "block";

      } else {
        hasAttemptedWrong = true;
        playBambooClack();
        btnElement.classList.add("wrong");
        btnElement.disabled = true;

        document.getElementById("hint-msg").textContent = "惜しい！文脈を再吟味してみましょう（再選択可）";
      }
    }

    function nextQuestion() {
      playHyoshigi();
      if (currentIndex < activeQuestions.length - 1) {
        currentIndex++;
        renderQuestion();
      } else {
        finishGame();
      }
    }
    window.nextQuestion = nextQuestion;

    function finishGame() {
      document.getElementById("finish-screen").style.display = "flex";
      document.getElementById("finish-summary").innerHTML = 
        `全100問の攻堅修練を見事完遂しました！<br>一度も間違えずに即答できた問題数：<strong>${firstTryCorrectCount} / 100 題</strong>`;
    }

    function restartGame() {
      currentIndex = 0;
      firstTryCorrectCount = 0;
      clearedQuestions.clear();
      document.getElementById("finish-screen").style.display = "none";
      assembleQuizQueue();
      renderQuestion();
    }
    window.restartGame = restartGame;

    function openCatalog() {
      playHyoshigi();
      const grid = document.getElementById("catalog-pills");
      grid.innerHTML = "";

      activeQuestions.forEach((q, idx) => {
        const pill = document.createElement("div");
        pill.className = "q-pill";
        if (clearedQuestions.has(idx)) pill.classList.add("cleared");
        if (idx === currentIndex) pill.classList.add("active");
        pill.textContent = `${idx + 1}`;
        pill.title = `${q.partName} - 問${q.id}`;
        pill.onclick = () => {
          currentIndex = idx;
          closeCatalog();
          renderQuestion();
        };
        grid.appendChild(pill);
      });

      document.getElementById("catalog-modal").style.display = "flex";
    }
    window.openCatalog = openCatalog;

    function closeCatalog() {
      document.getElementById("catalog-modal").style.display = "none";
    }
    window.closeCatalog = closeCatalog;

    /* Ambient Glowing Gold Particles & Fireflies Engine */
    const canvas = document.getElementById("ambient-canvas");
    const ctx = canvas.getContext("2d");
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    class GoldParticle {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.radius = Math.random() * 2 + 1;
        this.vx = (Math.random() - 0.5) * 0.7;
        this.vy = (Math.random() - 0.7) * 0.8;
        this.alpha = Math.random();
        this.alphaStep = Math.random() * 0.02 + 0.008;
        this.pulseDir = Math.random() > 0.5 ? 1 : -1;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.alpha += this.alphaStep * this.pulseDir;
        if (this.alpha >= 1) { this.alpha = 1; this.pulseDir = -1; }
        if (this.alpha <= 0.1) { this.alpha = 0.1; this.pulseDir = 1; }
        if (this.x < 0) this.x = canvas.width;
        if (this.x > canvas.width) this.x = 0;
        if (this.y < 0) this.y = canvas.height;
        if (this.y > canvas.height) this.y = 0;
      }
      draw() {
        ctx.save();
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(253, 224, 71, ${this.alpha * 0.8})`;
        ctx.shadowColor = "#facc15";
        ctx.shadowBlur = 8;
        ctx.fill();
        ctx.restore();
      }
    }

    for (let i = 0; i < 40; i++) {
      particles.push(new GoldParticle());
    }

    function animateAmbient() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animateAmbient);
    }
    animateAmbient();
  </script>
